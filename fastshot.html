<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fastshot — Describe an app. We'll build it.</title>
<meta name="description" content="Fastshot turns a written description into a working app.">
<script>document.documentElement.classList.add('anim')</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=block');

:root{
  --font-text: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-display: Inter, var(--font-text);

  --u: min(0.06410256vw, 0.12400794vh);
  --vu: 0.09920635vh;
  --inset-top: 41; --inset-bottom: 106;

  --brand-x:225; --brand-y:45; --mark:34; --brand-gap:12; --brand-fs:18.49;
  --links-y:50.5; --links-gap:50; --links-fs:21.69;
  --cta-x:1195; --cta-y:42; --cta-w:140; --cta-h:43; --cta-r:12; --cta-fs:15.70; --cta-dy:2;

  --hero-gap:51;
  --h1-y:323; --h1-fs:36.25; --display-ls:0.0018em;
  --nav-ls:-0.0115em; --brand-ls:-0.0154em; --cta-ls:-0.0127em; --body-ls:0.007em;
  --label-ls:normal; --model-ls:normal; --proof-ls:0.0065em;
  --w-regular:400; --w-display-wght:410; --w-medium:500; --w-semibold:600;
  --w-display:var(--w-display-wght); --w-nav:400; --w-brand:500; --w-cta:520;
  --w-body:var(--w-regular); --w-label:var(--w-medium);
  --w-model:var(--w-regular); --w-proof:480;

  --card-x:425; --card-y:413; --card-w:708; --card-h:143; --card-r:26;
  --ph-x:452; --ph-y:446; --ph-fs:9.97;
  --chips-x:444; --chips-y:505; --chip-h:30; --chip-r:9; --chip-fs:9.0; --chip-gap:5.5;
  --son-fs:10.4; --son-top:15.5; --chev-gap:6.2;
  --chev-x:1013.5; --chev-y:522.3;
  --att-x:1043.2; --att-y:515.1;
  --send-x:1084; --send-y:507; --send-d:35;

  --by-y:799; --by-fs:14.01; --logo-y:867; --logo-gap:62;

  --e-primary: cubic-bezier(.16,1,.3,1);
  --e-soft: cubic-bezier(.22,1,.36,1);
}
@supports (height:100dvh){
  :root{ --u: min(0.06410256vw, 0.12400794dvh); --vu: 0.09920635dvh; }
}
@media (min-width:1561px){ :root{ --inset-top:27; --inset-bottom:74; } }

*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  overflow:hidden;
  background:#0a0d12;
  font-family:var(--font-text);
  font-synthesis:none;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:geometricPrecision;
}
button,input,textarea{ font:inherit; color:inherit; background:none; border:0; }
img,svg{ display:block; }
a{ color:inherit; text-decoration:none; }
button{ cursor:pointer; }
:focus-visible{ outline:2px solid #F8B285; outline-offset:3px; border-radius:4px; }

/* ---------- stage ---------- */
.stage{ position:fixed; inset:0; overflow:hidden; background:#0a0d12; }
.stage-video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
.frame{
  position:absolute; inset:0; z-index:1;
  display:flex; flex-direction:column;
  padding: calc(var(--inset-top)*var(--vu)) calc(225*var(--u)) calc(var(--inset-bottom)*var(--vu));
}
#menu{ position:absolute; width:0; height:0; opacity:0; pointer-events:none; }

/* ---------- nav ---------- */
header.nav{
  position:relative;
  flex:none;
  height: calc(43*var(--u));
  display:flex; align-items:center; justify-content:space-between;
}
.brand{ display:flex; align-items:center; gap: calc(var(--brand-gap)*var(--u)); }
.brand .mark{ width: calc(var(--mark)*var(--u)); height: calc(var(--mark)*var(--u)); flex:none; }
.brand .word{
  font-family:var(--font-display);
  font-size: calc(var(--brand-fs)*var(--u));
  font-weight:var(--w-brand);
  letter-spacing:var(--brand-ls);
  color:#fff;
  transform: translateY(calc(1*var(--u)));
  font-variation-settings:"opsz" 32;
  text-shadow: 0 calc(1*var(--u)) calc(10*var(--u)) rgba(0,0,0,.30);
}

.links{
  position:absolute; left:50%; transform:translateX(-50%);
  top: calc((var(--links-y) - var(--inset-top))*var(--u));
  display:flex; align-items:center; gap: calc(var(--links-gap)*var(--u));
}
.links a{
  font-family:var(--font-text);
  font-size: calc(var(--links-fs)*var(--u));
  font-weight:var(--w-nav);
  letter-spacing:var(--nav-ls);
  line-height:1.2;
  color:#fff;
  text-shadow: 0 calc(1*var(--u)) calc(12*var(--u)) rgba(0,0,0,.32);
  transition:opacity .18s ease;
}
.links a:hover{ opacity:.72; }

.cta{
  flex:none;
  align-self:flex-start;
  margin-top: calc((var(--cta-y) - var(--inset-top))*var(--u));
  width: calc(var(--cta-w)*var(--u));
  height: calc(var(--cta-h)*var(--u));
  border-radius: calc(var(--cta-r)*var(--u));
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-text);
  font-size: calc(var(--cta-fs)*var(--u));
  font-weight:var(--w-cta);
  letter-spacing:var(--cta-ls);
  color:#fff;
  background: linear-gradient(180deg,#3d3d3f 0%,#1d1d20 100%);
  box-shadow: inset 0 calc(1*var(--u)) 0 rgba(255,255,255,.10), 0 calc(2*var(--u)) calc(14*var(--u)) rgba(0,0,0,.28);
  transition: filter .15s ease, transform .1s ease;
}
.cta span{ display:block; transform: translateY(calc(var(--cta-dy)*var(--u))); }
.cta:hover{ filter:brightness(1.16); }
.cta:active{ transform: translateY(1px); }

.burger{
  display:none; flex:none;
  width:38px; height:38px; border-radius:11px;
  background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.14);
  align-items:center; justify-content:center;
}
.burger svg{ width:17px; height:12px; }

/* ---------- mobile sheet ---------- */
.sheet{
  display:none;
  flex:none;
}
#menu:checked ~ .sheet{ grid-template-rows: minmax(0,1fr); }
.sheet > *{ min-height:0; overflow:hidden; }
.sheet-panel{
  background: rgba(24,24,27,.86);
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
  border-radius:16px;
  border:1px solid rgba(255,255,255,.09);
  padding:18px;
  margin-top:12px;
  display:flex; flex-direction:column; gap:16px;
}
.sheet-panel a{ font-size:15px; color:#fff; font-weight:400; }
.sheet-cta{
  height:40px; border-radius:11px; font-size:15px; font-weight:520;
  display:flex; align-items:center; justify-content:center;
  background: linear-gradient(180deg,#3d3d3f 0%,#1d1d20 100%);
  margin-top:4px;
}

/* ---------- hero ---------- */
main.hero{
  flex:1;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap: calc(var(--hero-gap)*var(--vu));
  padding-bottom: calc(4*var(--vu));
  min-height:0;
}
.h1{
  font-family:var(--font-display);
  font-size: calc(var(--h1-fs)*var(--u));
  font-weight:var(--w-display);
  line-height:1.10;
  letter-spacing:var(--display-ls);
  color:#fff;
  text-align:center;
  text-shadow: 0 calc(2*var(--u)) calc(22*var(--u)) rgba(0,0,0,.30);
  font-variation-settings:"opsz" 32;
}

/* ---------- composer ---------- */
.card{
  position:relative;
  width: calc(var(--card-w)*var(--u));
  height: calc(var(--card-h)*var(--u));
  border-radius: calc(var(--card-r)*var(--u));
  margin-right: calc(3*var(--u));
  background: rgba(41,41,43,.955);
  -webkit-backdrop-filter: blur(calc(26*var(--u))) saturate(112%);
  backdrop-filter: blur(calc(26*var(--u))) saturate(112%);
  box-shadow: inset 0 0 0 1px rgba(214,228,255,.14), 0 calc(22*var(--u)) calc(60*var(--u)) rgba(0,0,0,.30);
}
.ph{
  position:absolute;
  left: calc((var(--ph-x) - var(--card-x))*var(--u));
  top: calc((var(--ph-y) - var(--card-y))*var(--u));
  right: calc(24*var(--u));
  color:#8B8C8E;
  font-size: calc(var(--ph-fs)*var(--u));
  font-weight:var(--w-body);
  line-height:1.35;
  letter-spacing:var(--body-ls);
  white-space:nowrap;
  overflow:hidden;
}

.tools{
  position:absolute;
  left: calc((var(--chips-x) - var(--card-x))*var(--u));
  top: calc((var(--chips-y) - var(--card-y))*var(--u));
  right: calc(-1*var(--u));
  height: calc(var(--chip-h)*var(--u));
}
.chips{
  position:absolute; left:0; top:0; height:100%;
  display:flex; align-items:center; gap: calc(var(--chip-gap)*var(--u));
}
.chip{
  display:inline-flex; align-items:center;
  height: calc(var(--chip-h)*var(--u));
  width: calc(var(--cw)*var(--u));
  padding-left: calc(var(--pl)*var(--u));
  border-radius: calc(var(--chip-r)*var(--u));
  gap: calc(var(--ig)*var(--u));
  font-family:var(--font-text);
  font-size: calc(var(--chip-fs)*var(--u));
  font-weight:var(--w-label);
  letter-spacing:var(--label-ls);
  color:#909093;
  line-height:1;
  background: linear-gradient(180deg, rgba(255,255,255,.088) 0%, rgba(255,255,255,.050) 45%, rgba(255,255,255,.038) 100%);
  border:1px solid rgba(255,255,255,.05);
  transition: background .15s ease, color .15s ease;
}
.chip:hover{
  background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.07));
  color:#c8c8cb;
}
.chip svg{ flex:none; height:auto; }
.chip .label{ display:block; transform: translateY(calc(2*var(--u))); white-space:nowrap; }

.right{ position:absolute; inset:0; pointer-events:none; }
.right > *{ position:absolute; pointer-events:auto; }
.model{
  left: calc((955 - 444 - 0.8)*var(--u));
  top: calc(var(--son-top)*var(--u));
  display:inline-flex; align-items:center; gap: calc(var(--chev-gap)*var(--u));
  font-family:var(--font-text);
  font-size: calc(var(--son-fs)*var(--u));
  font-weight:var(--w-model);
  letter-spacing:var(--model-ls);
  color:#98999C;
  line-height:1;
  white-space:nowrap;
}
.model svg{ width: calc(6.8*var(--u)); flex:none; }
.attach{
  left: calc((var(--att-x) - var(--chips-x))*var(--u));
  top: calc((var(--att-y) - var(--chips-y))*var(--u));
  color:#A9AAAD;
  transition:color .15s ease;
}
.attach svg{ width: calc(19.79*var(--u)); display:block; }
.attach:hover{ color:#fff; }
.send{
  left: calc((var(--send-x) - var(--chips-x))*var(--u));
  top: calc((var(--send-y) - var(--chips-y))*var(--u));
  width: calc(var(--send-d)*var(--u));
  height: calc(var(--send-d)*var(--u));
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background: linear-gradient(163deg,#FBBC94 0%,#F49D70 46%,#E88654 100%);
  box-shadow: 0 calc(3*var(--u)) calc(12*var(--u)) rgba(210,110,60,.34);
  transition: filter .15s ease, transform .1s ease;
}
.send svg{ width: calc(11.66*var(--u)); }
.send:hover{ filter:brightness(1.07); }
.send:active{ transform:scale(.95); }

/* ---------- proof ---------- */
footer.proof{
  flex:none;
  display:flex; flex-direction:column; align-items:center;
  gap: calc(52.3*var(--vu));
}
.proof p{
  font-family:var(--font-text);
  font-size: calc(var(--by-fs)*var(--u));
  font-weight:var(--w-proof);
  letter-spacing:var(--proof-ls);
  color: rgba(255,255,255,.95);
  text-shadow: 0 calc(1*var(--u)) calc(12*var(--u)) rgba(0,0,0,.35);
  font-variation-settings:"opsz" 32;
}
.logos{ display:flex; align-items:center; gap: calc(var(--logo-gap)*var(--u)); color:#fff; }
.logos svg{ fill:#fff; color:#fff; height:auto; filter: drop-shadow(0 calc(1*var(--u)) calc(10*var(--u)) rgba(0,0,0,.30)); }
.logos svg.google{ width: calc(96.84*var(--u)); }
.logos svg.cisco{ width: calc(67.29*var(--u)); }
.logos svg.adobe{ width: calc(88.68*var(--u)); }

/* ---------- entrance animation ---------- */
@media (prefers-reduced-motion:no-preference){
  html.anim .brand{ animation: e-settle-down .58s var(--e-soft) both; animation-delay:.06s; }
  html.anim .mark{ animation: e-mark .62s var(--e-primary) both; animation-delay:.06s; }
  html.anim .links a:nth-child(1){ animation: e-settle-down .50s var(--e-soft) both; animation-delay:.16s; }
  html.anim .links a:nth-child(2){ animation: e-settle-down .50s var(--e-soft) both; animation-delay:.21s; }
  html.anim .links a:nth-child(3){ animation: e-settle-down .50s var(--e-soft) both; animation-delay:.26s; }
  html.anim .links a:nth-child(4){ animation: e-settle-down .50s var(--e-soft) both; animation-delay:.31s; }
  html.anim header .cta{ animation: e-settle-down .55s var(--e-soft) both; animation-delay:.34s; }
  html.anim .h1{ animation: e-focus 1.00s var(--e-primary) both; animation-delay:.30s; will-change:transform,opacity; }
  html.anim .card{ animation: e-panel .90s var(--e-primary) both; animation-delay:.62s; will-change:transform,opacity; }
  html.anim .ph{ animation: e-populate .50s var(--e-soft) both; animation-delay:.88s; }
  html.anim .chips{ animation: e-populate .50s var(--e-soft) both; animation-delay:.94s; }
  html.anim .right{ animation: e-populate .50s var(--e-soft) both; animation-delay:1.00s; }
  html.anim .send{ animation: e-send .50s var(--e-primary) both; animation-delay:1.00s; }
  html.anim .proof p{ animation: e-settle-up .55s var(--e-soft) both; animation-delay:1.08s; }
  html.anim .logos svg:nth-child(1){ animation: e-settle-up .55s var(--e-soft) both; animation-delay:1.16s; }
  html.anim .logos svg:nth-child(2){ animation: e-settle-up .55s var(--e-soft) both; animation-delay:1.22s; }
  html.anim .logos svg:nth-child(3){ animation: e-settle-up .55s var(--e-soft) both; animation-delay:1.28s; }
}
@keyframes e-settle-down{ from{ opacity:0; transform: translateY(calc(-5*var(--u))); } to{ opacity:1; transform:none; } }
@keyframes e-settle-up{ from{ opacity:0; transform: translateY(calc(6*var(--u))); } to{ opacity:1; transform:none; } }
@keyframes e-mark{ from{ transform:scale(.9); } to{ transform:none; } }
@keyframes e-focus{ from{ opacity:0; transform: translateY(calc(14*var(--u))); filter: blur(calc(6*var(--u))); } to{ opacity:1; transform:none; filter:blur(0); } }
@keyframes e-panel{ from{ opacity:0; transform: translateY(calc(18*var(--u))) scale(.985); } to{ opacity:1; transform:none; } }
@keyframes e-populate{ from{ opacity:0; transform: translateY(calc(4*var(--u))); } to{ opacity:1; transform:none; } }
@keyframes e-send{ from{ transform:scale(.82); } to{ transform:none; } }
@media (prefers-reduced-motion:reduce){
  html.anim *{ animation-duration:.01ms !important; animation-delay:0s !important; }
}

/* ================= TABLET ================= */
@media (min-width:600px) and (max-width:1180px) and (min-height:600px){
  :root{ --u:1px; }
  .burger, .sheet{ display:none !important; }
  .frame{ padding: clamp(24px,3.4vh,44px) clamp(28px,4.2vw,60px) clamp(26px,4.4vh,56px); }
  .h1{ font-size: clamp(27px,4.3vw,44px); line-height:1.12; white-space:nowrap; }
  .card{
    width: min(100%, clamp(516px,74vw,760px));
    height:auto; margin-right:0;
    padding: clamp(15px,1.9vw,24px);
    border-radius: clamp(17px,2.1vw,26px);
    display:flex; flex-direction:column; gap: clamp(20px,3.2vh,44px);
  }
  .ph{ position:static; white-space:normal; right:auto; font-size: clamp(11px,1.35vw,14px); line-height:1.4; }
  .tools{
    position:static; left:auto; top:auto; right:auto; height:auto;
    display:flex; flex-direction:row; flex-wrap:wrap; align-items:center;
    gap: clamp(10px,1.4vw,18px);
  }
  .chips{ position:static; height:auto; flex-wrap:nowrap; gap: clamp(6px,0.85vw,10px); }
  .chip{ width:auto; height: clamp(29px,3.4vh,34px); padding: 0 clamp(7px,1vw,13px); font-size: clamp(9.6px,1.12vw,12.5px); }
  .right{ position:static; inset:auto; display:flex; align-items:center; margin-left:auto; gap:0; }
  .right > *{ position:static; }
  .model{ font-size: clamp(9.8px,1.12vw,12.5px); }
  .attach{ margin-left: clamp(9px,1.4vw,20px); }
  .send{ margin-left: clamp(9px,1.3vw,18px); width: clamp(32px,3.5vw,38px); height: clamp(32px,3.5vw,38px); }
  footer.proof{ gap: clamp(15px,2.5vh,30px); }
}

/* ================= COMPACT (phone) ================= */
@media (max-width:599px), (max-height:599px) and (max-width:1180px){
  :root{ --u:1px; }
  .frame{
    padding:
      max(18px, env(safe-area-inset-top))
      max(clamp(18px,5.2vw,40px), env(safe-area-inset-right))
      max(20px, env(safe-area-inset-bottom))
      max(clamp(18px,5.2vw,40px), env(safe-area-inset-left));
  }
  .links, header .cta{ display:none; }
  .burger{ display:flex; }
  .sheet{ display:grid; grid-template-rows: minmax(0,0fr); overflow:hidden; transition: grid-template-rows .32s cubic-bezier(.4,0,.2,1); }
  .brand .mark{ width:30px; height:30px; }
  .h1{
    width:100%; max-width:15ch;
    font-size: clamp(29px,7.6vw,50px); line-height:1.14; letter-spacing:-.012em;
  }
  .card{
    width:100%; max-width:600px; height:auto; margin-right:0;
    display:flex; flex-direction:column;
    gap: clamp(16px,4.6vh,34px);
    padding: clamp(13px,3.4vw,18px);
  }
  .ph{ position:static; right:auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size: clamp(9.4px,2.95vw,14px); }
  .tools{
    position:static; left:auto; top:auto; right:auto; height:auto;
    display:flex; flex-direction:column; align-items:stretch; gap:12px;
  }
  .chips{ position:static; height:auto; flex-wrap:wrap; }
  .chip{ width:auto; padding:0 12px; }
  .right{ position:static; inset:auto; display:flex; align-items:center; justify-content:flex-start; }
  .right > *{ position:static; }
  .attach{ margin-left:auto; }
  .send{ margin-left:14px; width:40px; height:40px; }
}
@media (max-width:1180px) and (max-height:560px){
  main.hero{ gap:16px; padding-top:10px; }
  .h1{ font-size: clamp(24px,5.4vh,34px); }
  footer.proof{ gap:10px; }
}
</style>
</head>
<body>
<div class="stage">
  <video class="stage-video" autoplay muted loop playsinline preload="auto"
    src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260826_124724_bc041163-d651-425f-aea3-2acc1efc2c96.mp4"></video>

  <div class="frame">
    <input type="checkbox" id="menu">

    <header class="nav">
      <a class="brand" href="#" aria-label="Fastshot home">
        <svg class="mark" viewBox="0 0 34 34" width="34" height="34" aria-hidden="true">
          <circle cx="17" cy="17" r="17" fill="#9C86CE"/>
          <circle cx="17" cy="17" r="8.6" fill="#FFFFFF"/>
          <circle cx="17" cy="17" r="3.7" fill="#151519"/>
        </svg>
        <span class="word">Fastshot</span>
      </a>

      <nav class="links">
        <a href="#">Features</a>
        <a href="#">Examples</a>
        <a href="#">Pricing</a>
        <a href="#">Docs</a>
      </nav>

      <a class="cta" href="#"><span>Get Started</span></a>

      <label class="burger" for="menu" aria-label="Open menu">
        <svg viewBox="0 0 17 12" fill="none" aria-hidden="true">
          <rect y="0" width="17" height="2" rx="1" fill="#fff"/>
          <rect y="10" width="17" height="2" rx="1" fill="#fff"/>
        </svg>
      </label>
    </header>

    <div class="sheet">
      <div class="sheet-panel">
        <a href="#">Features</a>
        <a href="#">Examples</a>
        <a href="#">Pricing</a>
        <a href="#">Docs</a>
        <a class="sheet-cta" href="#"><span>Get Started</span></a>
      </div>
    </div>

    <main class="hero">
      <h1 class="h1">Describe an app. We&rsquo;ll build it.</h1>

      <form class="card" onsubmit="return false">
        <p class="ph">Build a fintech tracking app with bank level privacy and&hellip;</p>

        <div class="tools">
          <div class="chips">

<script>
(function(){
  var root = document.documentElement;
  function done(){ root.classList.remove('anim'); }
  var timer = setTimeout(done, 2600);
  var logos = document.querySelectorAll('.logos svg');
  var last = logos[logos.length - 1];
  if (last){
    last.addEventListener('animationend', function(){ clearTimeout(timer); done(); }, { once:true });
  }
})();
</script>
