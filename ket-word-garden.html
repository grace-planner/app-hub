<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e3f1ed">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

<title>单词乐园</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout concept: a single-column play sheet. Chunky outlined tiles with hard offset shadows, like stickers.
   Two games (flip-and-match, tap-to-clear) share one tile language and are switched with tabs. */
:root {
  --bg: #e3f1ed;
  --surface: #ffffff;
  --word-bg: #fff0b8;
  --good-bg: #cdf0ea;
  --ink: #17263c;
  --ink-soft: #4b5c75;
  --line: #17263c;
  --shadow: #17263c;
  --coral: #ff6a55;
  --sun: #ffc83d;
  --teal: #12a091;
  --on-accent: #17263c;
  --overlay: rgba(14, 22, 38, 0.55);
  --font-display: 'Fredoka', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
  --font-word: 'Andika', 'Trebuchet MS', 'Comic Sans MS', system-ui, sans-serif;
  --font-ui: system-ui, -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1625; --surface: #1a2538; --word-bg: #3a3118; --good-bg: #12403b;
    --ink: #eaf1ff; --ink-soft: #a9b9d3; --line: #8ea6cc; --shadow: #04070d;
    --coral: #ff7e6a; --sun: #ffd25e; --teal: #35c6b6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1625; --surface: #1a2538; --word-bg: #3a3118; --good-bg: #12403b;
  --ink: #eaf1ff; --ink-soft: #a9b9d3; --line: #8ea6cc; --shadow: #04070d;
  --coral: #ff7e6a; --sun: #ffd25e; --teal: #35c6b6;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 4px solid var(--teal); outline-offset: 3px; }

.app {
  max-width: 520px;
  margin: 0 auto;
  padding-block: 16px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* shared chunky control look */
.chunk {
  border: 3px solid var(--line);
  background: var(--surface);
  box-shadow: 0 4px 0 var(--shadow);
  transition: transform 0.08s, box-shadow 0.08s, background 0.15s;
}
.chunk:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.sticker {
  font-family: var(--font-word); font-weight: 700; font-size: 14px; letter-spacing: 0.06em;
  background: var(--sun); color: var(--on-accent);
  border: 3px solid var(--line); border-radius: 10px; padding: 4px 8px;
  transform: rotate(-6deg); box-shadow: 0 3px 0 var(--shadow); flex: none;
}
h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.1; margin: 0; }
.sub { margin: 2px 0 0; font-size: 13px; color: var(--ink-soft); }
.icon-btn { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; flex: none; padding: 0; }
.tools { display: flex; gap: 10px; flex: none; }
.voice { display: grid; gap: 10px; margin-bottom: 18px; padding: 14px; border: 3px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: 0 4px 0 var(--shadow); }
.voice label { font-family: var(--font-display); font-weight: 600; font-size: 17px; }
.voice select { width: 100%; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: var(--word-bg); border: 3px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.voice .btn { justify-self: start; }
.voice-note { margin: 0; font-size: 13px; color: var(--ink-soft); }

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.tab { font-family: var(--font-display); font-weight: 600; font-size: 17px; padding: 11px 8px; border-radius: 14px; }
.tab[aria-selected="true"] { background: var(--coral); color: var(--on-accent); }

.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 15px; font-weight: 600; padding: 7px 14px; border-radius: 999px; }
.chip[aria-pressed="true"] { background: var(--sun); color: var(--on-accent); }

.stats { display: flex; gap: 8px; margin: 14px 0 10px; }
.stat { flex: 1; min-width: 0; border: 3px solid var(--line); border-radius: 14px; background: var(--surface); padding: 5px 10px 6px; }
.stat span { display: block; font-size: 12px; color: var(--ink-soft); line-height: 1.3; }
.stat b { display: block; font-family: var(--font-display); font-weight: 600; font-size: 21px; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tip { font-size: 14px; color: var(--ink-soft); margin: 0 0 14px; }

.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }

/* memory cards */
.card { position: relative; width: 100%; aspect-ratio: 1 / 1.12; padding: 0; border: 0; background: none; perspective: 700px; }
.card-inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 0.45s cubic-bezier(0.3, 0.7, 0.3, 1.1); }
.card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; display: grid; place-items: center;
  border: 3px solid var(--line); border-radius: 16px; box-shadow: 0 4px 0 var(--shadow);
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
.face.back {
  background-color: var(--coral);
  background-image:
    radial-gradient(circle at 20% 24%, rgba(255, 255, 255, 0.4) 0 4px, transparent 5px),
    radial-gradient(circle at 78% 72%, rgba(255, 255, 255, 0.4) 0 4px, transparent 5px);
}
.mark { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 9vw, 44px); color: var(--on-accent); }
.face.front { transform: rotateY(180deg); background: var(--surface); }
.face.front.kind-word { background: var(--word-bg); }
.card.matched .face.front { background: var(--good-bg); border-color: var(--teal); }

.emoji { font-size: clamp(30px, 9vw, 50px); line-height: 1; }
.word { font-family: var(--font-word); font-weight: 700; font-size: clamp(13px, 3.7vw, 20px); padding: 0 4px; text-align: center; line-height: 1.2; }
.word.long { font-size: clamp(10px, 2.7vw, 15px); }
.zhtxt { font-family: var(--font-display); font-weight: 600; font-size: clamp(14px, 4.2vw, 21px); padding: 0 4px; text-align: center; line-height: 1.25; overflow-wrap: anywhere; }
.libbar { display: grid; gap: 10px; margin-bottom: 4px; }
.libbar select { width: 100%; min-width: 0; font: inherit; font-size: 16px; color: var(--ink); background: var(--word-bg); border: 3px solid var(--line); border-radius: 12px; padding: 9px 12px; }
.libbar .voice-note { margin: 0; }

/* clear-game tiles */
.tile {
  width: 100%; aspect-ratio: 1 / 1; padding: 0; display: grid; place-items: center;
  border: 3px solid var(--line); border-radius: 16px; background: var(--surface);
  box-shadow: 0 4px 0 var(--shadow);
  transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
}
.tile.kind-word { background: var(--word-bg); }
.tile.sel { background: var(--sun); color: var(--on-accent); transform: translateY(-4px); box-shadow: 0 8px 0 var(--shadow); outline: 4px solid var(--teal); outline-offset: 2px; }
.tile.wrong { background: var(--coral); color: var(--on-accent); animation: shake 0.35s; }
.tile.hint { animation: pulse 0.6s ease-in-out 3; }
.tile.gone { animation: pop 0.35s forwards; pointer-events: none; }

@keyframes shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
@keyframes pulse { 50% { transform: scale(1.1); background: var(--sun); color: var(--on-accent); } }
@keyframes pop { 40% { transform: scale(1.18); } 100% { transform: scale(0); opacity: 0; visibility: hidden; } }

.foot { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.btn { font-family: var(--font-display); font-weight: 600; font-size: 17px; padding: 10px 18px; border-radius: 14px; }
.btn.primary { background: var(--coral); color: var(--on-accent); }

/* win dialog */
.overlay {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: var(--overlay);
  padding: 16px;
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.modal {
  width: min(100%, 420px); max-height: 100%; overflow: auto; min-width: 0;
  background: var(--surface); border: 3px solid var(--line); border-radius: 24px;
  box-shadow: 0 8px 0 var(--shadow); padding: 22px 20px 20px;
}
.modal h2 { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.2; margin: 0; text-wrap: balance; }
.stars { display: flex; gap: 6px; margin: 10px 0 8px; }
.star { width: 46px; height: 46px; fill: none; stroke: var(--ink-soft); stroke-width: 1.6; stroke-linejoin: round; }
.star.on { fill: var(--sun); stroke: var(--line); stroke-width: 1.8; animation: starpop 0.5s both; animation-delay: calc(var(--i) * 0.18s); }
@keyframes starpop { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.25) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
.line { margin: 0; font-size: 16px; font-variant-numeric: tabular-nums; }
.note { margin: 4px 0 0; font-weight: 700; color: var(--teal); }
.learned-h { margin: 16px 0 0; font-size: 13px; color: var(--ink-soft); }
.learned { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 18px; }
.pill { font-family: var(--font-word); font-size: 14px; padding: 4px 10px; border: 2px solid var(--line); border-radius: 999px; background: var(--word-bg); }
.pill small { font-family: var(--font-ui); font-size: 12px; color: var(--ink-soft); margin-left: 4px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.confetti i { position: absolute; top: -16px; width: 10px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
.confetti i:nth-child(4n+1) { background: var(--coral); }
.confetti i:nth-child(4n+2) { background: var(--sun); }
.confetti i:nth-child(4n+3) { background: var(--teal); }
.confetti i:nth-child(4n) { background: var(--ink-soft); }
@keyframes fall { to { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot)); } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
}
</style>
</head>
<body>

<main class="app">
  <header class="top">
    <div class="brand">
      <span class="sticker" aria-hidden="true">KET</span>
      <div>
        <h1>单词乐园</h1>
        <p class="sub">翻牌记忆 · 单词消消乐</p>
      </div>
    </div>
    <div class="tools">
    <button class="icon-btn chunk" id="voiceBtn" type="button" aria-expanded="false" aria-controls="voicePanel" aria-label="词库和朗读声音设置">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 5h14a2 2 0 012 2v8a2 2 0 01-2 2h-7l-4 3v-3H5a2 2 0 01-2-2V7a2 2 0 012-2z"/>
        <path d="M8 10h8M8 13h5"/>
      </svg>
    </button>
    <button class="icon-btn chunk" id="soundBtn" type="button" aria-pressed="true" aria-label="声音开关">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/>
        <path id="icoOn" d="M15.5 9a4 4 0 010 6M18 6.5a8 8 0 010 11"/>
        <path id="icoOff" d="M16 9.5l5 5M21 9.5l-5 5" hidden/>
      </svg>
    </button>
    </div>
  </header>

  <section class="voice" id="voicePanel" hidden aria-label="词库和朗读声音设置">
    <label for="topicSel">词库主题</label>
    <select id="topicSel"></select>
    <label for="voiceSel">朗读声音</label>
    <select id="voiceSel"></select>
    <button class="btn chunk" type="button" id="voiceTest">试听 apple</button>
    <p class="voice-note" id="voiceNote"></p>
  </section>

  <div class="tabs" role="tablist" aria-label="选择游戏">
    <button class="tab chunk" role="tab" id="tabMem" type="button" aria-selected="true" aria-controls="panelMem">翻牌记忆</button>
    <button class="tab chunk" role="tab" id="tabMt" type="button" aria-selected="false" aria-controls="panelMt">单词消消乐</button>
  </div>

  <section id="panelMem" role="tabpanel" aria-labelledby="tabMem">
    <div class="controls" role="group" aria-label="难度">
      <button class="chip chunk" type="button" data-diff="easy" aria-pressed="false">简单 · 4对</button>
      <button class="chip chunk" type="button" data-diff="normal" aria-pressed="true">普通 · 6对</button>
      <button class="chip chunk" type="button" data-diff="hard" aria-pressed="false">挑战 · 8对</button>
    </div>
    <div class="stats">
      <div class="stat"><span>步数</span><b id="memMoves">0</b></div>
      <div class="stat"><span>用时</span><b id="memTime">00:00</b></div>
      <div class="stat"><span>最佳</span><b id="memBest">—</b></div>
    </div>
    <p class="tip">每次翻开两张牌，图片和它的单词是一对。翻到的牌会读出发音。</p>
    <div class="board" id="memBoard"></div>
    <div class="foot">
      <button class="btn chunk" type="button" id="memReset">重新洗牌</button>
    </div>
  </section>

  <section id="panelMt" role="tabpanel" aria-labelledby="tabMt" hidden>
    <div class="libbar">
      <div class="controls" role="group" aria-label="词库">
        <button class="chip chunk" type="button" data-lib="ket" aria-pressed="true">KET · 图片配对</button>
        <button class="chip chunk" type="button" data-lib="cet4" aria-pressed="false">四级 · 中文配对</button>
      </div>
      <select id="cetRange" aria-label="四级词汇范围" hidden></select>
      <p class="voice-note" id="cetNote" hidden>四级词库整理自 KyleBing/english-vocabulary（BSD-3-Clause）。四级单词没有录好的声音，会用设备自带的英语声音朗读，可以在右上角的设置里换声音。</p>
    </div>
    <div class="stats">
      <div class="stat"><span>关卡</span><b id="mtLevel">第1关</b></div>
      <div class="stat"><span>得分</span><b id="mtScore">0</b></div>
      <div class="stat"><span>连击</span><b id="mtCombo">—</b></div>
      <div class="stat"><span>用时</span><b id="mtTime">00:00</b></div>
    </div>
    <p class="tip" id="mtTip">先点一张图片，再点它的单词，配对成功就消掉。连续配对对分数加倍。</p>
    <div class="board" id="mtBoard"></div>
    <div class="foot">
      <button class="btn chunk" type="button" id="mtHint">提示</button>
      <button class="btn chunk" type="button" id="mtReset">重玩本关</button>
      <button class="btn chunk" type="button" id="mtRestart">回到第1关</button>
    </div>
  </section>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="wTitle">
    <h2 id="wTitle"></h2>
    <div class="stars" id="wStars" role="img"></div>
    <p class="line" id="wLine"></p>
    <p class="note" id="wNote" hidden></p>
    <p class="learned-h">这局学到的单词（点一下听发音）</p>
    <div class="learned" id="wWords"></div>
    <div class="actions">
      <button class="btn chunk primary" type="button" id="wPrimary"></button>
      <button class="btn chunk" type="button" id="wSecondary" hidden></button>
    </div>
  </div>
</div>

      LIB.loading = false;
      fillRange();
      drawLib();
      loadProg();
      mtNew();
    }).catch(function () {
      LIB.loading = false;
      LIB.cur = 'ket';
      store.set('wg.mtlib', 'ket');
      drawLib();
      loadProg();
      mtNew();
      $('#mtTip').textContent = '四级词库没有加载成功，已经切回 KET。刷新页面后再试一次。';
    });
  }
  function fillRange() {
    var sel = $('#cetRange');
    var cnt = {};
    var all = LIB.data || [];
    GROUPS.forEach(function (g) { cnt[g[0]] = all.filter(function (x) { return g[0].indexOf(x.w.charAt(0).toLowerCase()) >= 0; }).length; });
    sel.innerHTML = '<option value="all">全部乱序' + (all.length ? '（' + all.length + ' 个词）' : '') + '</option>' +
      GROUPS.map(function (g) { return '<option value="' + g[0] + '">' + g[1] + ' 开头' + (all.length ? '（' + cnt[g[0]] + '）' : '') + '</option>'; }).join('');
    sel.value = LIB.range;
  }
  function drawLib() {
    var cet = LIB.cur === 'cet4';
    $$('[data-lib]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.lib === LIB.cur ? 'true' : 'false'); });
    $('#cetRange').hidden = !cet;
    $('#cetNote').hidden = !cet;
    $('#mtTip').textContent = cet
      ? '先点一个中文意思，再点它对应的英文单词，配对成功就消掉。点一下会读出单词。'
      : '先点一张图片，再点它的单词，配对成功就消掉。连续配对对分数加倍。';
  }
  function setLib(lib) {
    if (LIB.cur === lib) return;
    LIB.cur = lib;
    store.set('wg.mtlib', lib);
    drawLib();
    loadProg();
    mtNew();
  }
  function loadProg() {
    var lv = 1, base = 0;
    try {
      var d = JSON.parse(store.get(progKey()) || 'null');
      if (d && d.level >= 1 && d.level < 1000) { lv = Math.floor(d.level); base = Math.max(0, Math.floor(d.base || 0)); }
    } catch (e) {}
    mt.level = lv;
    mt.base = base;
  }
  function saveProg(level, base) { store.set(progKey(), JSON.stringify({ level: level, base: base })); }
  function updMt() {
    $('#mtLevel').textContent = '第' + mt.level + '关';
    $('#mtScore').textContent = mt.score;
    $('#mtCombo').textContent = mt.combo > 1 ? '×' + mt.combo : '—';
  }
  function mtNew() {
    if (LIB.cur === 'cet4' && !LIB.data) { loadCet(); return; }
    mt.timer.reset();
    mt.over = false; mt.busy = false; mt.sel = null; mt.combo = 0; mt.mistakes = 0; mt.began = false;
    mt.score = mt.base;
    var n = LV[Math.min(mt.level, LV.length) - 1];
    mt.picks = LIB.cur === 'cet4' ? pickCet(n) : pick(n);
    preload(mt.picks);
    mt.left = mt.picks.length;
    mt.tiles = shuffle(mt.picks.reduce(function (a, p, i) {
      a.push({ id: i, kind: 'pic', p: p, gone: false }, { id: i, kind: 'word', p: p, gone: false });
      return a;
    }, []));
    var board = $('#mtBoard');
    board.textContent = '';
    mt.tiles.forEach(function (t, i) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tile kind-' + t.kind;
      btn.dataset.i = i;
      btn.setAttribute('aria-label', t.kind === 'pic' && !t.p.e ? t.p.zh : t.p.w);
      btn.innerHTML = t.kind === 'pic'
        ? (t.p.e ? '<span class="emoji" aria-hidden="true">' + t.p.e + '</span>' : '<span class="zhtxt">' + t.p.zh + '</span>')
        : '<span class="' + wordCls(t.p.w) + '">' + t.p.w + '</span>';
      t.el = btn;
      board.appendChild(btn);
    });
    updMt();
  }
  function clearHints() { $$('.tile.hint').forEach(function (e) { e.classList.remove('hint'); }); }
  function mtTap(i) {
    var t = mt.tiles[i];
    if (!t || mt.over || mt.busy || t.gone) return;
    mt.began = true;
    mt.timer.start();
    clearHints();
    speak(t.p.w);
    if (mt.sel === null) {
      mt.sel = i; t.el.classList.add('sel'); sfx.flip();
      return;
    }
    if (mt.sel === i) {
      t.el.classList.remove('sel'); mt.sel = null;
      return;
    }
    var a = mt.tiles[mt.sel];
    if (a.kind === t.kind) {
      a.el.classList.remove('sel');
      mt.sel = i; t.el.classList.add('sel'); sfx.flip();
      return;
    }
    if (a.id === t.id) {
      mt.sel = null;
      mt.combo++;
      mt.score += 10 * Math.min(mt.combo, 5);
      sfx.match();
      [a, t].forEach(function (x) {
        x.gone = true;
        x.el.classList.remove('sel');
        x.el.classList.add('gone');
        x.el.disabled = true;
      });
      mt.left--;
      updMt();
      if (mt.left === 0) setTimeout(mtWin, reduce ? 0 : 450);
    } else {
      mt.mistakes++;
      mt.combo = 0;
      mt.sel = null;
      mt.busy = true;
      sfx.wrong();
      a.el.classList.remove('sel');
      [a, t].forEach(function (x) { x.el.classList.add('wrong'); });
      updMt();
      setTimeout(function () {
        [a, t].forEach(function (x) { x.el.classList.remove('wrong'); });
        mt.busy = false;
      }, reduce ? 0 : 380);
    }
  }
  function mtHint() {
    if (mt.over) return;
    var rem = mt.tiles.filter(function (t) { return !t.gone; });
    if (!rem.length) return;
    $$('.tile.sel').forEach(function (e) { e.classList.remove('sel'); });
    mt.sel = null;
    clearHints();
    var id = rem[Math.floor(Math.random() * rem.length)].id;
    rem.filter(function (t) { return t.id === id; }).forEach(function (t) { t.el.classList.add('hint'); });
    mt.combo = 0;
    updMt();
    setTimeout(clearHints, 1900);
  }
  function mtWin() {
    mt.over = true;
    var sec = mt.timer.stop();
    var stars = mt.mistakes <= 1 ? 3 : (mt.mistakes <= 4 ? 2 : 1);
    var lvl = mt.level;
    saveProg(lvl + 1, mt.score);
    showWin({
      title: '第' + lvl + '关 通关！',
      stars: stars,
      line: '得分 ' + mt.score + ' · 失误 ' + mt.mistakes + ' 次 · 用时 ' + fmt(sec),
      note: '',
      words: mt.picks,
      primary: { label: '下一关', fn: function () { mt.level++; mt.base = mt.score; mtNew(); } },
      secondary: { label: '再玩本关', fn: mtNew }
    });
  }

  /* ---------- tabs, sound, boot ---------- */
  function setTab(t) {
    var prev = state.tab;
    state.tab = t;
    var isMem = t === 'mem';
    $('#tabMem').setAttribute('aria-selected', isMem ? 'true' : 'false');
    $('#tabMt').setAttribute('aria-selected', isMem ? 'false' : 'true');
    $('#panelMem').hidden = !isMem;
    $('#panelMt').hidden = isMem;
    if (prev !== t) {
      (prev === 'mem' ? mem : mt).timer.pause();
      var cur = isMem ? mem : mt;
      if (cur.began && !cur.over) cur.timer.start();
    }
  }
  function drawSound() {
    $('#soundBtn').setAttribute('aria-pressed', state.sound ? 'true' : 'false');
    $('#icoOn').hidden = !state.sound;
    $('#icoOff').hidden = state.sound;
  }

  function start(d) {
    mem.timer = makeTimer($('#memTime'));
    mt.timer = makeTimer($('#mtTime'));
    if (d && DIFF[d.diff]) mem.diff = d.diff;
    $$('[data-diff]').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.diff === mem.diff ? 'true' : 'false'); });

    $('#memBoard').addEventListener('click', function (e) {
      var b = e.target.closest('.card');
      if (b) memFlip(+b.dataset.i);
    });
    $('#mtBoard').addEventListener('click', function (e) {
      var b = e.target.closest('.tile');
      if (b) mtTap(+b.dataset.i);
    });
    $$('[data-diff]').forEach(function (b) { b.addEventListener('click', function () { setDiff(b.dataset.diff); }); });
    $('#memReset').addEventListener('click', memNew);
    $('#mtReset').addEventListener('click', mtNew);
    $('#mtHint').addEventListener('click', mtHint);
    $('#tabMem').addEventListener('click', function () { setTab('mem'); });
    $('#tabMt').addEventListener('click', function () { setTab('mt'); });
    $('#soundBtn').addEventListener('click', function () {
      state.sound = !state.sound;
      store.set('wg.sound', state.sound ? '1' : '0');
      if (!state.sound) stopSpeech();
      drawSound();
      sfx.flip();
    });
    $('#overlay').addEventListener('click', function (e) { if (e.target === this) hideWin(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideWin(); });

    $('#voiceBtn').addEventListener('click', function () {
      var p = $('#voicePanel');
      p.hidden = !p.hidden;
      this.setAttribute('aria-expanded', p.hidden ? 'false' : 'true');
      if (!p.hidden) fillVoices(true);
    });
    $('#voiceSel').addEventListener('change', function () {
      voice.uri = this.value;
      store.set('wg.voice', voice.uri);
      speak('apple', true);
    });
    $('#voiceTest').addEventListener('click', function () { speak('apple', true); });
    try {
      if (window.speechSynthesis) window.speechSynthesis.addEventListener('voiceschanged', function () { fillVoices(); });
    } catch (e) {}
    var ts = $('#topicSel');
    ts.innerHTML = '<option value="">全部主题（' + WORDS.length + ' 个词）</option>' +
      TOPICS.map(function (t) { return '<option value="' + t.k + '">' + t.n + '（' + t.w.length + '）</option>'; }).join('');
    ts.value = state.topic;
    ts.addEventListener('change', function () {
      state.topic = this.value;
      store.set('wg.topic', state.topic);
      memNew();
      loadProg();
      mtNew();
    });
    fillVoices(true);
    setTimeout(function () { fillVoices(); }, 800);
    setTimeout(function () { fillVoices(); }, 2500);

    $$('[data-lib]').forEach(function (b) { b.addEventListener('click', function () { setLib(b.dataset.lib); }); });
    $('#cetRange').addEventListener('change', function () {
      LIB.range = this.value;
      store.set('wg.cetrange', LIB.range);
      loadProg();
      mtNew();
    });
    fillRange();
    drawLib();
    $('#mtRestart').addEventListener('click', function () {
      saveProg(1, 0);
      mt.level = 1;
      mt.base = 0;
      mtNew();
    });
    drawSound();
    memNew();
    loadProg();
    mtNew();
    if (d && d.tab === 'mt') setTab('mt');
    try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(function () { return { tab: state.tab, diff: mem.diff }; }); } catch (e) {}
  }

  var hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start);
  else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
